<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <title>superlight-uma · 活跃设备统计</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <!-- config.js: instance settings (generated by build.sh from Cloudflare Pages env vars) -->
  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <!-- 登录 -->
  <main id="login-view" class="login" hidden>
    <form id="login-form" class="panel login-card" autocomplete="on">
      <div class="brand">
        <img src="favicon.svg" alt="" width="32" height="32">
        <div>
          <h1>活跃设备统计</h1>
          <p class="muted">superlight-uma 管理面板</p>
        </div>
      </div>
      <label>
        <span>接口地址</span>
        <input id="login-base" name="base" type="url" required placeholder="https://uma.example.com" autocomplete="url">
      </label>
      <label>
        <span>管理密钥</span>
        <input id="login-key" name="key" type="password" placeholder="UMA_ADMIN_KEY（服务端未设置密钥时留空）" autocomplete="current-password">
      </label>
      <label class="check">
        <input id="login-remember" type="checkbox" checked>
        <span>在此浏览器记住（保存在 localStorage）</span>
      </label>
      <p id="login-error" class="error" role="alert" hidden></p>
      <button id="login-submit" type="submit" class="primary">登录</button>
    </form>
  </main>

  <!-- 面板 -->
  <div id="dash-view" hidden>
    <header class="topbar">
      <div class="brand small">
        <img src="favicon.svg" alt="" width="24" height="24">
        <strong>活跃设备统计</strong>
      </div>
      <div class="toolbar">
        <label class="app-picker">
          <span class="sr-only">应用</span>
          <input id="app-input" list="app-list" placeholder="app_id" spellcheck="false" autocapitalize="off">
          <datalist id="app-list"></datalist>
        </label>
        <label class="platform-picker">
          <span class="sr-only">平台</span>
          <select id="platform-select">
            <option value="__all__">全部平台</option>
          </select>
        </label>
        <button id="refresh-btn" type="button" title="刷新">刷新</button>
        <button id="logout-btn" type="button" class="ghost" title="退出并清除保存的密钥">退出</button>
      </div>
    </header>

    <main class="content">
      <p id="dash-error" class="error banner" role="alert" hidden></p>

      <section class="cards" aria-label="今日概览">
        <article class="card"><h2>日活 DAU</h2><p class="value" id="v-dau">–</p><p class="hint">今天（UTC）</p></article>
        <article class="card"><h2>周活 WAU</h2><p class="value" id="v-wau">–</p><p class="hint">最近 7 天</p></article>
        <article class="card"><h2>月活 MAU</h2><p class="value" id="v-mau">–</p><p class="hint">最近 30 天</p></article>
        <article class="card"><h2>总设备</h2><p class="value" id="v-total">–</p><p class="hint">历史累计</p></article>
      </section>

      <section class="panel" aria-label="平台分布">
        <div class="panel-head"><h2>平台分布</h2></div>
        <div id="platform-list" class="platform-list"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>趋势</h2>
          <div class="segmented" role="group" aria-label="时间范围" id="range">
            <button type="button" data-days="7">7 天</button>
            <button type="button" data-days="30">30 天</button>
            <button type="button" data-days="90">90 天</button>
            <button type="button" data-days="365">365 天</button>
          </div>
        </div>
        <div class="legend" id="legend"></div>
        <div class="chart" id="chart" aria-label="趋势图"></div>
        <p class="muted small-text">每日汇总每小时更新一次，今天的数据为阶段值。日期按 UTC 计算。</p>
      </section>

      <section class="panel">
        <div class="panel-head"><h2>每日明细</h2></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>日期</th><th>DAU</th><th>WAU</th><th>MAU</th><th>总设备</th></tr></thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>
      </section>

      <footer class="muted small-text" id="footer"></footer>
    </main>
  </div>
</body>
</html>
